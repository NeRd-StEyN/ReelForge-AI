name: Monthly Session Renewal

on:
  schedule:
    # Run on the 1st of every month at 2:00 AM UTC (you can adjust time)
    - cron: '0 2 1 * *'
  
  # Also allow manual trigger if needed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew-session:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install instagrapi python-dotenv
      
      - name: Attempt Session Renewal with Password
        id: renew
        env:
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
        run: |
          python auto_renew_session.py
      
      - name: Check if session was renewed
        if: success()
        run: |
          if [ -f insta_session.json ]; then
            echo "✅ New session file created"
            ls -lh insta_session.json
          fi
      
      - name: Commit and push renewed session
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f insta_session.json
          git commit -m "🔄 Auto-renewed Instagram session on $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Read renewed session content
        if: success()
        id: session_file
        run: |
          echo "payload<<EOF" >> $GITHUB_OUTPUT
          cat insta_session.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update GitHub Secret with new session
        if: success()
        uses: gliech/create-github-secret-action@v1
        with:
          name: INSTA_SESSION
          value: ${{ steps.session_file.outputs.payload }}
          repository: ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      
      - name: Alert on failure
        if: failure()
        run: |
          echo "❌ Automatic session renewal failed"
          echo "⚠️  Manual renewal needed - see logs above for details"
          exit 1
