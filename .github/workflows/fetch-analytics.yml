name: Fetch Analytics

on:
  workflow_dispatch:

jobs:
  fetch-analytics:
    runs-on: ubuntu-latest
    env:
      INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
      INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
      INSTA_SESSION: ${{ secrets.INSTA_SESSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore feedback history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/insta_analytics_history.jsonl
            data/used_topics.jsonl
            data/reel_outcomes.jsonl
          key: reelforge-data-${{ github.ref_name }}
          restore-keys: |
            reelforge-data-

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Extract analytics from cache [skip ci]" || echo "No changes to commit"
          git push
