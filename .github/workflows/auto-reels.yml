name: Auto Reels

on:
  workflow_dispatch:
  schedule:
    # 2 FIXED SLOTS PER DAY (Proven peak slots for this account)
    # 16:00 IST = 10:30 UTC — Afternoon peak (fetch analytics ONCE here)
    - cron: '30 10 * * *'
    # 19:00 IST = 13:30 UTC — Evening peak (NO analytics fetch — 0 credits used)
    - cron: '30 13 * * *'

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      OPENROUTER_FALLBACK_MODELS: ${{ secrets.OPENROUTER_FALLBACK_MODELS }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      CONTENT_DOMAIN: ${{ secrets.CONTENT_DOMAIN }}
      CONTENT_LANGUAGE: ${{ secrets.CONTENT_LANGUAGE }}
      TTS_VOICE: ${{ secrets.TTS_VOICE }}
      TTS_RATE: ${{ secrets.TTS_RATE }}
      SINGLE_NARRATION_MODE: 'true'
      AUTO_POST_STORY: 'true'
      AUTO_CLEANUP_ASSETS: 'true'
      ENABLE_INSTAGRAM_ANALYTICS: 'true'
      INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
      INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      # MAKE_ANALYTICS_WEBHOOK_URL is injected selectively per-step (see below).
      # Keeping it absent here ensures no step accidentally inherits the live key.
      INSTA_SESSION: ${{ secrets.INSTA_SESSION }}
      # Raw secret stored separately — only the first run step will export it.
      _MAKE_ANALYTICS_WEBHOOK_SECRET: ${{ secrets.MAKE_ANALYTICS_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Instagram session file
        if: env.INSTA_SESSION != ''
        run: python -c "import os; open('insta_session.json', 'w', encoding='utf-8').write(os.environ['INSTA_SESSION'].strip())"

      - name: Restore feedback history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/insta_analytics_history.jsonl
            data/pexels_used_ids.json
            data/used_topics.jsonl
            data/reel_outcomes.jsonl
            data/voice_index.txt
            data/pending_posts.jsonl
            data/analytics_fail_count.txt
            data/last_analytics_fetch.txt
            data/last_topic_pillar.txt
            data/make_analytics_lock.txt
          key: reelforge-data-${{ github.ref_name }}
          restore-keys: |
            reelforge-data-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set analytics URL (first daily run only)
        # Passes the real webhook URL only if:
        #  a) this is the scheduled first daily cron (10:30 UTC = 16:00 IST), OR
        #  b) this is a workflow_dispatch AND the current UTC hour is before noon.
        # In all other cases MAKE_ANALYTICS_WEBHOOK_URL stays empty — the Python
        # hard lock inside fetch_analytics_from_make is the final safety net.
        run: |
          HOUR=$(date -u +%H | sed 's/^0//')
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "30 10 * * *" ] || [ "$SCHEDULE" = "30 5 * * *" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$HOUR" -lt 12 ]; }; then
            echo "MAKE_ANALYTICS_WEBHOOK_URL=$_MAKE_ANALYTICS_WEBHOOK_SECRET" >> $GITHUB_ENV
            echo "[Analytics] First run window detected — analytics URL exported."
          else
            echo "MAKE_ANALYTICS_WEBHOOK_URL=" >> $GITHUB_ENV
            echo "[Analytics] Second/evening run — analytics URL suppressed (0 Make credits used)."
          fi

      - name: Generate and post one reel
        run: |
          python auto_scheduler.py --mode batch --count 1

      - name: Save feedback history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/insta_analytics_history.jsonl
            data/pexels_used_ids.json
            data/used_topics.jsonl
            data/reel_outcomes.jsonl
            data/voice_index.txt
            data/pending_posts.jsonl
            data/analytics_fail_count.txt
            data/last_analytics_fetch.txt
            data/last_topic_pillar.txt
            data/make_analytics_lock.txt
          key: reelforge-data-${{ github.ref_name }}-${{ github.run_id }}
